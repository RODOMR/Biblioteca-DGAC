{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - Biblioteca DGAC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        /* --- MISMOS ESTILOS QUE TU LOGIN --- */
        :root { --primary: #0F172A; --accent: #3B82F6; --text-light: #fff; }
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-image: url("{% static 'img/inicio/banner_fondo.jpg' %}");
            background-size: cover; background-position: center;
            min-height: 100vh; display: flex; flex-direction: column;
            color: #fff; backdrop-filter: brightness(0.6);
        }
        .container {
            background: rgba(15, 23, 42, 0.85);
            padding: 40px 30px; border-radius: 15px; width: 100%; max-width: 400px;
            margin: 5rem auto; border-top: 4px solid var(--accent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.8em; }
        p.desc { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 0.9rem; }
        .form-group { position: relative; margin-bottom: 20px; }
        input {
            width: 100%; padding: 14px 45px; border-radius: 8px; border: 1px solid #475569;
            background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 1em;
        }
        i.icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #94a3b8; }
        button {
            width: 100%; padding: 14px; background: var(--accent); color: #fff;
            border: none; border-radius: 8px; cursor: pointer; font-size: 1.1em; font-weight: bold;
        }
        button:hover { background: #2563eb; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Recuperar Acceso</h1>
    <p class="desc">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <input type="email" name="email" placeholder="Tu correo registrado" required autofocus>
            <i class="fas fa-envelope icon"></i>
        </div>
        <button type="submit">Enviar Enlace</button>
    </form>

    <div class="links">
        <a href="{% url 'login' %}"><i class="fas fa-arrow-left"></i> Volver al Login</a>
    </div>
</div>

</body>
</html>
