{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contraseña Cambiada - Biblioteca DGAC</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #0F172A; --accent: #3B82F6; --text-light: #fff; }
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-image: url("{% static 'img/inicio/banner_fondo.jpg' %}");
            background-size: cover; background-position: center;
            min-height: 100vh; display: flex; flex-direction: column;
            color: #fff; backdrop-filter: brightness(0.6);
        }
        .container {
            background: rgba(15, 23, 42, 0.85);
            padding: 40px 30px; border-radius: 15px; width: 100%; max-width: 500px;
            margin: 5rem auto; border-top: 4px solid #10b981;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
        }
        h1 { margin-bottom: 20px; font-size: 1.8em; }
        p { color: #cbd5e1; margin-bottom: 30px; }
        .icon-box { font-size: 4rem; color: #10b981; margin-bottom: 20px; }
        .btn {
            display: inline-block; padding: 12px 30px; background: var(--accent); color: #fff;
            border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s;
        }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-box"><i class="fas fa-check-circle"></i></div>
        <h1>¡Listo!</h1>
        <p>Tu contraseña ha sido cambiada exitosamente. Ya puedes ingresar con tu nueva clave.</p>
        <a href="{% url 'login' %}" class="btn">Iniciar Sesión</a>
    </div>
</body>
</html>
