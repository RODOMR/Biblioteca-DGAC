{% extends "layout/base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Publicar Nueva Noticia</h4>
            </div>
            <div class="card-body p-4">
                
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Título</label>
                        {{ form.titulo }}
                        </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Imagen Destacada (Opcional)</label>
                        {{ form.imagen }}
                        <div class="form-text text-muted">
                            <i class="bi bi-info-circle"></i> Se recomienda formato JPG o PNG horizontal.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Contenido</label>
                        {{ form.contenido }}
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end pt-3 border-top">
                        <a href="{% url 'lista_noticias' %}" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4 shadow-sm">
                            <i class="bi bi-send-fill"></i> Publicar Noticia
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
